<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PC CLUB — Регистрация</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/auth.css') }}"
    >
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="logo">
            PC CLUB
        </div>

        <h1>Создание аккаунта</h1>

        <p class="subtitle">
            Зарегистрируйтесь для работы с системой
        </p>

        <form id="register-form">

            <div class="form-group">
                <label for="username">
                    Логин
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Придумайте логин"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@mail.com"
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="phone">
                    Телефон
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="+7 999 123-45-67"
                    autocomplete="tel"
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Пароль
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Минимум 6 символов"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div
                id="register-error"
                class="form-error hidden"
            ></div>

            <button
                type="submit"
                class="primary-button"
            >
                Создать аккаунт
            </button>

        </form>

        <div class="auth-footer">
            <span>Уже есть аккаунт?</span>

            <a href="/login">
                Войти
            </a>
        </div>

    </div>

</div>

<script
    src="{{ url_for('static', filename='js/auth.js') }}"
></script>

</body>
</html>
